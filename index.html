<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>宠安 · 透明宠物善终服务平台（演示）</title>
<style>
:root{--bg:#f6f3ee;--card:#fff;--ink:#2b2a28;--mute:#7b756c;--acc:#4f7a6a;--acc2:#e6efe9;--line:#e6e0d6;--warn:#b5653a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1a1b19;--card:#242522;--ink:#ece8e1;--mute:#9a948a;--acc:#7fb09d;--acc2:#27352f;--line:#34352f;--warn:#e0956a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1a1b19;--card:#242522;--ink:#ece8e1;--mute:#9a948a;--acc:#7fb09d;--acc2:#27352f;--line:#34352f;--warn:#e0956a;color-scheme:dark}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.6 -apple-system,"PingFang SC","Noto Sans SC","Microsoft YaHei",sans-serif;padding-bottom:84px}
#app{max-width:560px;margin:0 auto;padding:16px}
h1{font-size:22px;margin:4px 0}h2{font-size:17px;margin:20px 0 8px}
.sub{color:var(--mute);font-size:13px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin:10px 0}
.hero{background:var(--acc);color:#fff;border-radius:16px;padding:20px;margin-top:6px}
.hero p{margin:6px 0 0;opacity:.92}
.row{display:flex;justify-content:space-between;gap:10px;align-items:center}
.pill{display:inline-block;background:var(--acc2);color:var(--acc);border-radius:99px;padding:2px 10px;font-size:12px}
.btn{width:100%;border:0;background:var(--acc);color:#fff;font-size:16px;padding:13px;border-radius:12px;margin-top:12px;cursor:pointer}
.btn.ghost{background:var(--acc2);color:var(--acc)}
.btn:disabled{opacity:.45}
input,textarea,select{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px;margin-top:6px}
.pk{border:2px solid var(--line);cursor:pointer}.pk.on{border-color:var(--acc);background:var(--acc2)}
.li{display:flex;justify-content:space-between;font-size:13px;color:var(--mute);padding:2px 0}
.price{font-size:20px;font-weight:700;color:var(--acc)}
.tl{position:relative;margin:8px 0 0 10px;padding-left:22px;border-left:2px solid var(--line)}
.nd{position:relative;padding:0 0 16px}
.nd::before{content:"";position:absolute;left:-30px;top:3px;width:14px;height:14px;border-radius:50%;background:var(--bg);border:2px solid var(--line)}
.nd.done::before{background:var(--acc);border-color:var(--acc)}
.nd b{display:block}.nd small{color:var(--mute)}
.tabs{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs button{flex:1;border:0;background:none;color:var(--mute);padding:10px 0;font-size:12px;cursor:pointer}
.tabs button.on{color:var(--acc);font-weight:700}
.tabs span{display:block;font-size:20px}
.code{font:700 20px ui-monospace,Menlo,monospace;letter-spacing:1px;color:var(--acc)}
.note{font-size:12px;color:var(--warn)}
.step{display:flex;gap:10px;margin:8px 0}.step i{flex:none;width:24px;height:24px;border-radius:50%;background:var(--acc);color:#fff;font-style:normal;text-align:center;line-height:24px;font-size:13px}
</style></head><body>
<div id="app"></div>
<nav class="tabs" id="tabs"></nav>
<script>
var P=[
{n:"基础",d:"价格清晰，核心流程可核对",it:[["遗体接运",60],["一宠一炉火化",220],["简易骨灰盒",60],["过程记录与交接凭证",40]]},
{n:"标准",d:"增加告别空间与电子纪念",it:[["遗体接运",60],["一宠一炉火化",220],["骨灰罐",120],["告别厅（30 分钟）",180],["过程记录与交接凭证",40],["电子纪念册",60]]},
{n:"高端",d:"更长陪伴与定制纪念",it:[["遗体接运",60],["一宠一炉火化",220],["定制骨灰罐",280],["告别厅（60 分钟）",300],["过程记录与交接凭证",40],["电子纪念册",60],["专人陪伴",200]]}];
var A=[["毛发留存小瓶",88],["纪念相框",128],["云纪念空间（1 年）",99]];
var N=[["身份登记与唯一编号","接收时登记基本信息，生成唯一编号"],["火化前核对","对照编号与登记信息再次确认"],["火化进行","单独火化，关键节点留存记录"],["骨灰核对与交接","按编号核对，生成交接凭证"]];
var S={tab:"home",pkg:1,adds:[0,0,0],pet:"",kind:"狗狗",code:null,step:0,times:[],notes:[]};
var T=[["home","🏠","首页"],["book","📝","预约"],["rec","🔎","记录"],["mem","🕯️","纪念"]];
function sum(it){return it.reduce(function(a,x){return a+x[1]},0)}
function total(){var t=sum(P[S.pkg].it);A.forEach(function(a,i){if(S.adds[i])t+=a[1]});return t}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function hm(){var d=new Date();return d.getHours()+":"+String(d.getMinutes()).padStart(2,"0")}
function go(t){S.tab=t;draw();window.scrollTo(0,0)}
function pick(i){S.pkg=i;draw()}
function add(i){S.adds[i]=S.adds[i]?0:1;draw()}
function book(){
 var d=new Date(),r=String(Math.floor(1000+Math.random()*9000));
 S.code="PA-"+d.getFullYear()+String(d.getMonth()+1).padStart(2,"0")+String(d.getDate()).padStart(2,"0")+"-"+r;
 S.step=1;S.times=[hm()];go("rec")}
function next(){if(S.step<N.length){S.times[S.step]=hm();S.step++;draw()}}
function post(){var v=document.getElementById("msg").value.trim();if(!v)return;S.notes.unshift({t:v,h:hm()});draw()}
function home(){
 return '<div class="hero"><h1>宠安</h1><p>一站式透明宠物善终服务平台</p><p>让每一场告别都真实可信、被温柔承接</p></div>'+
 '<h2>三项核心能力</h2>'+
 [["🔎","服务过程可视化","身份编号、关键环节记录、骨灰交接凭证","解决信任问题"],["🏷️","明码标价","分项公示，附加项目自主选择","解决价格问题"],["🤍","哀伤关怀","告别前、告别时、告别后全周期陪伴","解决情感问题"]].map(function(x){return '<div class="card"><div class="row"><b>'+x[0]+" "+x[1]+'</b><span class="pill">'+x[3]+'</span></div><div class="sub">'+x[2]+'</div></div>'}).join("")+
 '<h2>使用流程</h2><div class="card">'+["预约服务","选择套餐","确认价格","身份登记","告别服务","过程记录","骨灰交接","自主选择纪念服务"].map(function(s,i){return '<div class="step"><i>'+(i+1)+'</i><span>'+s+'</span></div>'}).join("")+'</div>'+
 '<button class="btn" onclick="go(\'book\')">开始体验：预约服务</button>'+
 '<p class="sub">本页面为第七组课程汇报的产品演示原型。价格、编号与记录均为示例，并非真实报价或真实服务。</p>'}
function book_(){
 var h='<h1>预约与套餐</h1><div class="sub">先看清每一项费用，再决定是否预约。</div>';
 h+='<div class="card"><label>宠物名字<input id="pet" value="'+esc(S.pet)+'" placeholder="例如：团团" oninput="S.pet=this.value"></label>'+
 '<label>种类<select onchange="S.kind=this.value"><option'+(S.kind=="狗狗"?" selected":"")+'>狗狗</option><option'+(S.kind=="猫咪"?" selected":"")+'>猫咪</option><option'+(S.kind=="其他"?" selected":"")+'>其他</option></select></label></div>';
 P.forEach(function(p,i){h+='<div class="card pk'+(S.pkg==i?" on":"")+'" onclick="pick('+i+')"><div class="row"><b>'+p.n+'套餐</b><span class="price">¥'+sum(p.it)+'</span></div><div class="sub">'+p.d+'</div>'+(S.pkg==i?p.it.map(function(x){return '<div class="li"><span>'+x[0]+'</span><span>¥'+x[1]+'</span></div>'}).join(""):"")+'</div>'});
 h+='<h2>可选附加项目</h2><div class="sub">默认不选，不购买不影响基础服务。</div>';
 A.forEach(function(a,i){h+='<div class="card row" onclick="add('+i+')" style="cursor:pointer"><span>'+(S.adds[i]?"☑":"☐")+" "+a[0]+'</span><span>¥'+a[1]+'</span></div>'});
 h+='<div class="card row"><span>应付合计（无隐形消费）</span><span class="price">¥'+total()+'</span></div>';
 h+='<button class="btn" onclick="book()"'+(S.code?" disabled":"")+'>'+(S.code?"已预约":"确认价格并预约")+'</button><p class="note">以上为演示用示例价格，非真实报价。</p>';
 return h}
function rec(){
 if(!S.code)return '<h1>服务记录</h1><div class="card sub">还没有预约。请先在“预约”中选择套餐并确认价格。</div><button class="btn" onclick="go(\'book\')">去预约</button>';
 var h='<h1>服务记录</h1><div class="card"><div class="sub">'+esc(S.pet||"毛孩子")+" · "+S.kind+" · "+P[S.pkg].n+'套餐</div><div class="code">'+S.code+'</div><div class="sub">唯一编号：登记、核对、交接均凭此编号</div></div><div class="tl">';
 N.forEach(function(n,i){var d=i<S.step;h+='<div class="nd'+(d?" done":"")+'"><b>'+n[0]+(d?" ✓":"")+'</b><small>'+n[1]+(d?" · "+S.times[i]:"")+'</small></div>'});
 h+='</div>';
 if(S.step<N.length)h+='<button class="btn ghost" onclick="next()">演示：推进到下一环节</button>';
 else h+='<div class="card"><b>骨灰交接凭证</b><div class="li"><span>编号</span><span>'+S.code+'</span></div><div class="li"><span>宠物</span><span>'+esc(S.pet||"毛孩子")+'</span></div><div class="li"><span>状态</span><span>已核对并交接</span></div></div><button class="btn" onclick="go(\'mem\')">前往纪念空间</button>';
 return h}
function mem(){
 var h='<h1>纪念与陪伴</h1><div class="sub">以下内容均由你自主决定是否使用。</div>';
 h+='<div class="card"><b>写给'+esc(S.pet||"毛孩子")+'的话</b><textarea id="msg" rows="3" placeholder="想对它说些什么……"></textarea><button class="btn" onclick="post()">保存到电子纪念册</button></div>';
 S.notes.forEach(function(n){h+='<div class="card">'+esc(n.t)+'<div class="sub">'+n.h+'</div></div>'});
 h+='<h2>告别的三个阶段</h2>'+[["告别前","了解流程与费用，不必仓促决定"],["告别时","尊重你的告别意愿，提供安静的空间与陪伴"],["告别后","可选的电子纪念册、照片保存与回访"]].map(function(x){return '<div class="card"><b>'+x[0]+'</b><div class="sub">'+x[1]+'</div></div>'}).join("");
 h+='<p class="sub">如果悲伤让你难以承受，可以联系专业心理支持，服务人员也可以为你提供转介信息。</p>';
 return h}
function draw(){
 var v=S.tab=="home"?home():S.tab=="book"?book_():S.tab=="rec"?rec():mem();
 document.getElementById("app").innerHTML=v;
 document.getElementById("tabs").innerHTML=T.map(function(t){return '<button class="'+(S.tab==t[0]?"on":"")+'" onclick="go(\''+t[0]+'\')"><span>'+t[1]+'</span>'+t[2]+'</button>'}).join("")}
draw();
</script></body></html>
